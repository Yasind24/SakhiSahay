kind = "web"
previewPath = "/"
title = "SakhiSahay"
version = "1.0.0"
id = "artifacts/sakhi-sahay"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19434

[services.development]
run = "pnpm --filter @workspace/sakhi-sahay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sakhi-sahay", "run", "build" ]
publicDir = "artifacts/sakhi-sahay/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19434"
BASE_PATH = "/"
